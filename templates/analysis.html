<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Analizando... — Jagi-Sentinel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5 text-center" style="max-width: 600px;">
        <h2 class="mb-4">🛡️ Analizando tu red...</h2>

        <div class="spinner-border text-primary mb-4" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Cargando...</span>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <p id="mensaje-estado" class="mb-0 text-muted">Iniciando...</p>
            </div>
        </div>

        <p class="text-muted small mt-4">Esto puede tardar varios minutos dependiendo de la cantidad de dispositivos en tu red.</p>
    </div>

    <script>
        const analisisId = {{ analisis_id }};

        async function consultarEstado() {
            try {
                const respuesta = await fetch(`/api/estado/${analisisId}`);
                const datos = await respuesta.json();

                document.getElementById("mensaje-estado").textContent = datos.mensaje;

                if (datos.completado) {
                    if (datos.error) {
                        document.getElementById("mensaje-estado").textContent =
                            "Error: " + datos.error;
                    } else {
                        window.location.href = `/dashboard/${analisisId}`;
                    }
                } else {
                    setTimeout(consultarEstado, 2000);
                }
            } catch (e) {
                setTimeout(consultarEstado, 2000);
            }
        }

        consultarEstado();
    </script>
</body>
</html>
