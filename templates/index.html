<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Jagi-Sentinel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">🛡️ Jagi-Sentinel</h1>
            <p class="text-muted">Análisis automatizado de seguridad en redes IoT</p>
        </div>

        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body p-4">
                <h5 class="card-title mb-3">Iniciar nuevo análisis</h5>
                <form action="/analizar" method="post">
                    <div class="mb-3">
                        <label for="interfaz" class="form-label">Interfaz de red</label>
                        <select class="form-select" id="interfaz" name="interfaz" required>
                            {% for iface in interfaces %}
                                <option value="{{ iface }}">{{ iface }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar análisis</button>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/historial" class="text-decoration-none">Ver historial de análisis →</a>
        </div>
    </div>
</body>
</html>
